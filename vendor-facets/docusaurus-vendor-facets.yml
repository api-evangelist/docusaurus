# Vendor facets — Docusaurus. Meta's open-source static site generator: docs, a built-in blog and
# versioning out of the box, and everything API- or agent-shaped (OpenAPI reference, llms.txt,
# Markdown twins, MCP) supplied by community plugins the provider installs and hosts itself.
# Because the output is self-hosted on the provider's own domain, what it produces reads as
# first-party; the catch is that nothing agent-facing is on by default.
vendor: docusaurus
name: Docusaurus
website: https://docusaurus.io
areas:
- documentation
registry_keys:
- docusaurus
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: measured
summary: >-
  Docusaurus on its own earns the documentation and blog pointers; with community plugins it can also
  produce an llms.txt, an interactive OpenAPI reference with a try-it panel, and Markdown copies of pages,
  all self-hosted on the provider's domain and therefore read as the provider's own work. The qualifier
  is that every agent-facing piece is an optional third-party plugin, not a Docusaurus feature, and the
  only MCP route listed is a third-party hosted service graded `platform`. Contract Quality is untouched:
  the site renders the OpenAPI a provider already has.
features:
- id: docs-site
  name: Documentation site generator
  description: Builds a versioned documentation site from Markdown/MDX that the provider hosts on its
    own domain.
  source: https://docusaurus.io/community/resources
  tier: open-source
- id: blog-plugin
  name: Built-in blog plugin
  description: The classic preset ships a blog with posts, tags, authors and feeds.
  source: https://docusaurus.io/docs/blog
  tier: open-source
- id: plugin-llms
  name: docusaurus-plugin-llms (community)
  description: >-
    Generates llms.txt, llms-full.txt and optional per-page Markdown at build time, following llmstxt.org.
  source: https://github.com/rachfop/docusaurus-plugin-llms
  tier: open-source
- id: openapi-docs
  name: docusaurus-openapi-docs (community, Palo Alto Networks)
  description: >-
    Generates interactive OpenAPI reference pages from Swagger 2.0 / OpenAPI 3.x with an API demo panel,
    x-codeSamples and schema pages.
  source: https://github.com/PaloAltoNetworks/docusaurus-openapi-docs
  tier: open-source
- id: markdown-plugins
  name: Markdown-for-LLM plugins (community)
  description: Plugins that expose raw .md URLs or add a copy-page-as-Markdown button for AI tools.
  source: https://docusaurus.io/community/resources
  tier: open-source
- id: agentready-mcp
  name: AgentReady plugin (third party)
  description: A community-listed plugin that indexes the docs into a third-party service queryable over
    MCP.
  source: https://docusaurus.io/community/resources
  tier: unknown
- id: redocusaurus
  name: redocusaurus (community)
  description: A preset that embeds Redoc-rendered OpenAPI reference in a Docusaurus site.
  source: https://docusaurus.io/community/resources
  tier: open-source
maps:
- feature: docs-site
  check: documentation_present
  layer: composite
  provider_must: Declare the site as a Documentation pointer.
  catalog_pass_rate: 0.453
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.95
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
  cohort_pct: 100.0
  control_pct: 94.9
  delta_pp: 5.1
- feature: blog-plugin
  check: blog_present
  layer: composite
  provider_must: Actually post, and declare the blog as a Blog pointer.
  catalog_pass_rate: 0.529
  facet: developer_ergonomics
  points: 1
  baseline_pass_rate: 0.731
  cohort_pct: 82.5
  control_pct: 73.0
  delta_pp: 9.5
- feature: plugin-llms
  check: llms_txt_published
  layer: composite
  provider_must: Install and configure the community plugin; Docusaurus does not generate llms.txt itself.
  note: >-
    Built from the provider's own docs and served on the provider's own host, so it reads as the provider's
    llms.txt.
  catalog_pass_rate: 0.351
  facet: discoverability
  points: 4
  baseline_pass_rate: 0.65
  cohort_pct: 70.2
  control_pct: 65.0
  delta_pp: 5.2
- feature: openapi-docs
  check: api_reference_present
  layer: composite
  provider_must: >-
    Install the plugin, generate the reference from its OpenAPI and declare it as an APIReference pointer.
  catalog_pass_rate: 0.222
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.942
  saturated: true
  saturated_note: >-
    94% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
  cohort_pct: 97.4
  control_pct: 94.1
  delta_pp: 3.3
- feature: openapi-docs
  check: console_or_sandbox
  layer: composite
  provider_must: Keep the API demo panel's send button enabled and declare the reference as a Console
    pointer.
  catalog_pass_rate: 0.089
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.332
  cohort_pct: 28.9
  control_pct: 33.2
  delta_pp: -4.3
- feature: openapi-docs
  check: openapi_examples
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    The dimension reads examples inside the OpenAPI first; code samples the plugin renders reach only
    the Examples / Code Samples link fallback.
  points: 7
  baseline_pass_rate: 0.36
  cohort_pct: 33.3
  control_pct: 36.1
  delta_pp: -2.8
- feature: agentready-mcp
  check: mcp_server
  layer: agent_readiness
  grade: platform
  conditional: true
  condition: >-
    Only if the provider adopts the third-party AgentReady service; Docusaurus itself ships no MCP server.
  note: A shared third-party index serving many sites is the `platform` case (0.25 of 12).
  points: 12
  baseline_pass_rate: 0.22
  cohort_pct: 17.5
  control_pct: 22.0
  delta_pp: -4.5
earns_nothing:
- feature: openapi-docs
  check: examples_present
  why: Rendering the spec writes no examples back into it.
- feature: docs-site
  check: well_known_published
  why: >-
    Nothing in Docusaurus or the listed plugins serves an api-catalog, security.txt or protected-resource
    document.
out_of_reach:
  checks:
  - agent_skills
  - agent_card
  - change_log_present
  - sdk_count_1
  - cli_present
  - postman_present
  - rules_present
  - contract_present
  note: >-
    No listed Docusaurus feature or plugin produces skills, an agent card, SDKs, a CLI, a collection or
    a ruleset; a changelog is only a blog the provider chooses to use that way.
unscored_practice:
- feature: markdown-plugins
  why: Raw .md exposure and copy-as-Markdown are agent-facing formats no check reads.
- feature: plugin-llms
  why: llms-full.txt earns nothing beyond the llms.txt row.
surface:
  discoverability:
    reachable: 4.0
    total: 54
  developer_ergonomics:
    reachable: 11.0
    total: 42
  agent_readiness:
    reachable: 4.8
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
method: searched
source:
- https://docusaurus.io/community/resources
- https://docusaurus.io/docs/blog
- https://github.com/PaloAltoNetworks/docusaurus-openapi-docs
- https://github.com/rachfop/docusaurus-plugin-llms
